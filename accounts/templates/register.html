{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Student Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>

<body>
  <div class="auth-wrapper">

    <div class="auth-card">
      <!-- register  page ko close karne ke liye  -->
      <a href="{% url 'home' %}" class="close-btn">&times; </a>
      <div class="brand">
        <i class="fas fa-user-plus"></i>
        <h1>Create Account</h1>
        <p>Join Student Management System</p>
      </div>

      <div id="alert" class="alert alert-error"></div>
<!-- ye hidden input hota hai jo csrf ke througth creta kiya jaata hai and server tak send kiya jata ha jisase hame valid request milta hai  -->


      <form method="post" id="registerForm">
        {% csrf_token %}
        <!-- ye token automatic hiddden input generate kar deta haii  -->
       

        <!-- ============ NAME ROW ============ -->
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <div class="input-wrap">
              <i class="fas fa-user"></i>
              <input type="text" name="first_name" id="firstName" placeholder="John" required>
            </div>
          </div>

          <div class="form-group">
            <label>Last Name *</label>
            <div class="input-wrap">
              <i class="fas fa-user"></i>
              <input type="text" name="last_name" id="lastName" placeholder="Doe" required>
            </div>
          </div>
        </div>

        <!-- ============ USERNAME + EMAIL ============ -->
        <div class="form-row">
          <div class="form-group">
            <label>Username *</label>
            <div class="input-wrap">
              <i class="fas fa-at"></i>
              <input type="text" name="username" id="username" placeholder="himanshu3777" required>
            </div>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <div class="input-wrap">
              <i class="fas fa-envelope"></i>
              <input type="email" name="email" id="email" placeholder="hy@gmail.com" required>
            </div>
          </div>
        </div>

        <!-- ============ PHONE + ROLL NO ============ -->
        <div class="form-row">
          <div class="form-group">
            <label>Phone Number *</label>
            <div class="input-wrap">
              <i class="fas fa-phone"></i>
              <input type="tel" name="phone" id="phone" placeholder="+91 98765 43210" required>
            </div>
          </div>
          <div class="form-group">
            <label>Roll Number *</label>
            <div class="input-wrap">
              <i class="fas fa-id-card"></i>
              <input type="text" name="roll_number" id="rollNumber" placeholder="CS2024001" required>
            </div>
          </div>
        </div>

        <!-- ============ COURSE + GENDER ============ -->
        <div class="form-row">
          <div class="form-group">
            <label>Course *</label>
            <div class="input-wrap">
              <i class="fas fa-book"></i>

              <select name="course" id="course" required>
                <!-- ham views.py ko import kar all course ko fatch kar liya hai and us course ko ham is html file ke througth ham send kar yaha pe usaka use kar rahe hai  -->
                {% for course in course %}
                <option value="{{course.id}}">
                  {{course.courses_name}}
                </option>
                {% endfor%}
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <div class="input-wrap">
              <i class="fas fa-venus-mars"></i>
              <select name="gender" id="gender">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
        </div>

        <!-- ============ DOB ============ -->
        <div class="form-group">
          <label>Date of Birth</label>
          <div class="input-wrap">
            <i class="fas fa-calendar"></i>
            <input type="date" name="date_of_birth" id="dob">
          </div>
        </div>

        <!-- ============ ADDRESS ============ -->
        <div class="form-group">
          <label>Address</label>
          <div class="input-wrap">
            <i class="fas fa-map-marker-alt"></i>
            <input type="text" name="address" id="address" placeholder="123 Main St, City">
          </div>
        </div>

        <!-- ============ PASSWORD ============ -->
        <div class="form-row">
          <div class="form-group">
            <label>Password *</label>
            <div class="input-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" name="password" id="password" placeholder="Min. 6 characters" required>
            </div>
          </div>
          <div class="form-group">
            <label>Confirm Password *</label>
            <div class="input-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" name="confirm_password" id="confirmPassword" placeholder="Repeat password"
                required>
            </div>
          </div>
        </div>

        <!-- ============ SUBMIT ============ -->
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-user-check"></i> Register
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
      </div>
    </div>
  </div>

  <script src="{% static 'js/accounts.js' %}"></script>
</body>

</html>
