{% load static %}
<!-- {% load socialaccount %} -->
<!-- Simple language mein: ye Django ko batata hai ki Google/social login ke special template commands use karne hain. -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Management System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="{% static 'css/accounts.css' %}">
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- login page ko close karne ke liye  -->
      <a href="{% url 'home' %}" class="close-btn">&times; </a>

      <div class="brand">
        <i class="fas fa-graduation-cap"></i>
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="alert" class="alert alert-error"></div>

      <!-- data submit hone ke bad data kis url par jayega  -->
      <form id="loginForm" method="post">
        {% csrf_token %}
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" id="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" id="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="remember-row">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="{% url 'register' %}">Register</a>
      </div>
    </div>
  </div>

  <script src="{% static 'js/accounts.js' %}?v=2"></script>
</body>

</html>
