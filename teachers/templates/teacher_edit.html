{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Teacher | SMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'CSS/teachers.css' %}">
</head>
<body>
  <div class="layout">

    <!-- SIDEBAR (same as list) -->
    <aside class="sidebar" id="sidebar">
      <!-- ... same sidebar ... -->
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <h1>Edit Teacher</h1>
        <div class="profile-wrapper"><!-- ... --></div>
      </div>

      <a href="{% url 'teacher_list' %}" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Teachers
      </a>

      <div class="form-card">
        <div class="form-card-header">
          <i class="fas fa-user-edit"></i>
          <h2>Edit Teacher Information</h2>
        </div>

        <form method="post" id="teacherForm" action="{% url 'teacher_edit' teacher.id %}">
          {% csrf_token %}

          <div class="form-row">
            <div class="form-group">
              <label>Full Name *</label>
              <input type="text" name="name" class="form-control" value="{{ teacher.fname }}" required>
            </div>
            <div class="form-group">
              <label>Employee ID *</label>
              <input type="text" name="employee_id" class="form-control" value="{{ teacher.employee_id }}" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Email *</label>
              <input type="email" name="email" class="form-control" value="{{ teacher.email }}" required>
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" name="phone" class="form-control" value="{{ teacher.phone }}">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Subject *</label>
              <input type="text" name="subject" class="form-control" value="{{ teacher.subject }}" required>
            </div>
            <div class="form-group">
              <label>Qualification</label>
              <input type="text" name="qualification" class="form-control" value="{{ teacher.qualification }}">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Experience (Years)</label>
              <input type="number" name="experience" class="form-control" value="{{ teacher.experience }}" min="0">
            </div>
            <div class="form-group">
              <label>Joining Date</label>
              <input type="date" name="joining_date" class="form-control" value="{{ teacher.joining_date|date:'Y-m-d' }}">
            </div>
          </div>

          <div class="form-group">
            <label>Address</label>
            <textarea name="address" class="form-control" rows="3">{{ teacher.address }}</textarea>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Update Teacher
            </button>
            <a href="{% url 'teacher_list' %}" class="btn btn-secondary">
              <i class="fas fa-times"></i> Cancel
            </a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="{% static 'JS/sidebar.js' %}"></script>
  <script src="{% static 'JS/teachers.js' %}"></script>
</body>
</html>
