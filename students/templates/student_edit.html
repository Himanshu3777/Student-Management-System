{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Student | SMS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/students.css' %}">
</head>
<body>
  <div class="layout">

    <!-- SIDEBAR (same) -->
    <aside class="sidebar" id="sidebar">
      <!-- ... same sidebar ... -->
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <h1>Edit Student</h1>
        <div class="profile-wrapper"><!-- ... --></div>
      </div>

      <a href="{% url 'student_list' %}" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Students
      </a>

      <div class="form-card">
        <div class="form-card-header">
          <i class="fas fa-user-edit"></i>
          <h2>Edit Student Information</h2>
        </div>

        <form method="post" id="studentForm" action="#">
          {% csrf_token %}

          <div class="form-row">
            <div class="form-group">
              <label>First Name *</label>
              <input type="text" name="fname" class="form-control" value="{{ student.fname }}" required>
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input type="text" name="lname" class="form-control" value="{{ student.lname }}" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Roll Number *</label>
              <input type="text" name="roll_number" class="form-control" value="{{ student.roll }}" required>
            </div>
            <div class="form-group">
              <label>Email *</label>
              <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" name="phone" class="form-control" value="{{ student.phone }}">
            </div>
            <div class="form-group">
              <label>Course *</label>
              <select name="course" class="form-control" required>
                {% for c in course %}
                  <option value="{{ c.id }}" {% if c.id == student.course.id %}selected{% endif %}>
                    {{ c.courses_name }}
                  </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Gender</label>
              <select name="gender" class="form-control">
                <option value="male" {% if student.gender == 'male' %}selected{% endif %}>Male</option>
                <option value="female" {% if student.gender == 'female' %}selected{% endif %}>Female</option>
                <option value="other" {% if student.gender == 'other' %}selected{% endif %}>Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Date of Birth</label>
              <input type="date" name="dob" class="form-control" value="{{ student.DOB|date:'Y-m-d' }}">
            </div>
          </div>

          <div class="form-group">
            <label>Address</label>
            <textarea name="address" class="form-control" rows="3">{{ student.address }}</textarea>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Update Student
            </button>
            <a href="{% url 'student_list' %}" class="btn btn-secondary">
              <i class="fas fa-times"></i> Cancel
            </a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="{% static 'js/sidebar.js' %}"></script>
  <script src="{% static 'js/students.js' %}"></script>
</body>
</html>
